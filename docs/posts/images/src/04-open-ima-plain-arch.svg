<svg xmlns="http://www.w3.org/2000/svg" width="987" height="756" viewBox="0 0 987 756" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="987" height="756" fill="#fff"/>

  <!-- top row: application use cases -->
  <rect x="40" y="30" width="180" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="130" y="63" text-anchor="middle" font-size="16">知识库用例</text>

  <rect x="300" y="30" width="200" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="400" y="63" text-anchor="middle" font-size="16">文档摄取用例</text>

  <rect x="580" y="30" width="200" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="680" y="63" text-anchor="middle" font-size="16">网页收录用例</text>

  <!-- single user note where RBAC sits in tencent diagram -->
  <rect x="150" y="140" width="180" height="55" fill="#fff" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="240" y="163" text-anchor="middle" font-size="15">单用户</text>
  <text x="240" y="184" text-anchor="middle" font-size="12" fill="#555">无权限层</text>

  <!-- second row -->
  <rect x="60" y="270" width="200" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="160" y="295" text-anchor="middle" font-size="16">搜索与问答域</text>
  <text x="160" y="315" text-anchor="middle" font-size="12" fill="#555">SSE 流式</text>

  <rect x="330" y="270" width="220" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="440" y="295" text-anchor="middle" font-size="16">media 状态机</text>
  <text x="440" y="315" text-anchor="middle" font-size="12" fill="#555">medias 表 · 失败重试</text>

  <rect x="660" y="270" width="200" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="760" y="295" text-anchor="middle" font-size="16">知识库管理</text>
  <text x="760" y="315" text-anchor="middle" font-size="12" fill="#555">知识库域 · 库级隔离</text>

  <!-- kb use case -> kb management -->
  <line x1="240" y1="195" x2="240" y2="245" stroke="#000" stroke-width="1.5"/>
  <line x1="240" y1="245" x2="760" y2="245" stroke="#000" stroke-width="1.5"/>
  <line x1="760" y1="245" x2="760" y2="265" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- queue -->
  <rect x="340" y="390" width="200" height="55" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="440" y="413" text-anchor="middle" font-size="16">SQLite jobs 表</text>
  <text x="440" y="433" text-anchor="middle" font-size="12" fill="#555">worker pool · 退避重试</text>

  <!-- parser sidecar with sub-boxes -->
  <rect x="310" y="500" width="260" height="150" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="440" y="528" text-anchor="middle" font-size="16">parser sidecar（FastAPI）</text>
  <rect x="330" y="545" width="100" height="38" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="380" y="569" text-anchor="middle" font-size="13">PDF</text>
  <rect x="450" y="545" width="100" height="38" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="500" y="569" text-anchor="middle" font-size="13">DOCX</text>
  <rect x="330" y="595" width="100" height="38" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="380" y="619" text-anchor="middle" font-size="13">PPTX</text>
  <rect x="450" y="595" width="100" height="38" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="500" y="619" text-anchor="middle" font-size="13">MD·HTML·网页</text>

  <!-- rag / meili -->
  <rect x="60" y="680" width="200" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="160" y="702" text-anchor="middle" font-size="15">copilot 问答引擎</text>
  <text x="160" y="721" text-anchor="middle" font-size="12" fill="#555">ReAct Agent</text>

  <rect x="320" y="680" width="240" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="440" y="702" text-anchor="middle" font-size="15">Meilisearch + bge-m3</text>
  <text x="440" y="721" text-anchor="middle" font-size="12" fill="#555">BM25 · 向量 · RRF</text>

  <!-- local storage cylinder -->
  <ellipse cx="700" cy="685" rx="90" ry="14" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <path d="M610,685 L610,725 A90,14 0 0 0 790,725 L790,685" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="700" y="712" text-anchor="middle" font-size="15">./data 本地存储</text>

  <!-- right vertical bar -->
  <rect x="920" y="30" width="48" height="700" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="944" y="300" text-anchor="middle" font-size="17" writing-mode="tb">补偿式清理</text>
  <text x="944" y="520" text-anchor="middle" font-size="17" writing-mode="tb">对账 ticker</text>

  <!-- arrows -->
  <line x1="400" y1="85" x2="440" y2="265" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="85" x2="700" y2="180" stroke="#000" stroke-width="1.5"/>
  <line x1="700" y1="180" x2="460" y2="180" stroke="#000" stroke-width="1.5"/>
  <line x1="460" y1="180" x2="460" y2="265" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="130" y1="85" x2="130" y2="200" stroke="#000" stroke-width="1.5"/>
  <line x1="130" y1="200" x2="160" y2="265" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="440" y1="325" x2="440" y2="385" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="445" x2="440" y2="495" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="440" y1="650" x2="440" y2="675" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="160" y1="325" x2="160" y2="675" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="705" x2="315" y2="705" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="680" y1="85" x2="700" y2="180" stroke="#000" stroke-width="1.5"/>
  <line x1="700" y1="180" x2="700" y2="668" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- dashed lines to reconcile bar -->
  <line x1="550" y1="297" x2="630" y2="297" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="630" y1="297" x2="630" y2="345" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="630" y1="345" x2="915" y2="345" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="572" y1="575" x2="915" y2="575" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
