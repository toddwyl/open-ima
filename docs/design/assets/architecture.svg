<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
    <filter id="soft" x="-4%" y="-8%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1c1917" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- ===== 标题与图例 ===== -->
  <text x="48" y="52" font-size="23" font-weight="700" fill="#1c1917">Open IMA 架构</text>
  <text x="48" y="76" font-size="12.5" fill="#78716c">单机本地部署 · 数据全部落在 ./data 卷</text>

  <line x1="800" y1="44" x2="834" y2="44" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="842" y="49" font-size="12.5" fill="#57534e">离线存储流</text>
  <line x1="946" y1="44" x2="980" y2="44" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="988" y="49" font-size="12.5" fill="#57534e">在线问答流</text>

  <!-- 前端 -->
  <g filter="url(#soft)">
    <rect x="415" y="100" width="370" height="66" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  </g>
  <text x="437" y="126" font-size="14.5" font-weight="600" fill="#134e4a">前端 · React SPA(Go embed 托管)</text>
  <text x="437" y="148" font-size="11.5" fill="#57534e">知识库 / 文档 / 搜索 / 问答 工作区 · 配置中心</text>
  <line x1="600" y1="166" x2="600" y2="190" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="615" y="182" font-size="11" fill="#78716c">REST + SSE</text>

  <!-- ===== Go 服务(按领域划分) ===== -->
  <rect x="40" y="190" width="1120" height="400" rx="18" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <rect x="64" y="208" width="252" height="30" rx="9" fill="#0d9488"/>
  <text x="190" y="228" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Go 1.26 单体服务 · 按领域划分</text>

  <g filter="url(#soft)">
    <rect x="70" y="254" width="240" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="88" y="284" font-size="14.5" font-weight="600" fill="#134e4a">知识库域</text>
  <text x="88" y="312" font-size="11.5" fill="#57534e">知识库 CRUD · 级联删除</text>
  <text x="88" y="334" font-size="11.5" fill="#57534e">URL 收录:抓取后按内容</text>
  <text x="88" y="354" font-size="11.5" fill="#57534e">hash 落盘为 html 文档</text>

  <g filter="url(#soft)">
    <rect x="345" y="254" width="240" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="363" y="284" font-size="14.5" font-weight="600" fill="#134e4a">文档摄取域(媒体中心)</text>
  <text x="363" y="312" font-size="11.5" fill="#57534e">documents 生命周期状态机</text>
  <text x="363" y="334" font-size="11.5" fill="#57534e">分块器 512/80 · 标题上下文</text>
  <text x="363" y="354" font-size="11.5" fill="#57534e">任务队列 · 指数退避重试</text>

  <g filter="url(#soft)">
    <rect x="620" y="254" width="240" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="638" y="284" font-size="14.5" font-weight="600" fill="#134e4a">设置域</text>
  <text x="638" y="312" font-size="11.5" fill="#57534e">运行时配置持久化</text>
  <text x="638" y="334" font-size="11.5" fill="#57534e">(yaml → 环境变量 → 设置)</text>
  <text x="638" y="354" font-size="11.5" fill="#57534e">热切换 LLM · 更新 embedder</text>

  <g filter="url(#soft)">
    <rect x="895" y="254" width="240" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="913" y="284" font-size="14.5" font-weight="600" fill="#134e4a">对话问答域</text>
  <text x="913" y="312" font-size="11.5" fill="#57534e">query 改写(近 4 轮历史)</text>
  <text x="913" y="334" font-size="11.5" fill="#57534e">双路召回 · RRF 融合 Top-8</text>
  <text x="913" y="354" font-size="11.5" fill="#57534e">SSE 流式回答 · 引用落库</text>

  <line x1="310" y1="329" x2="343" y2="329" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="327" y="319" font-size="11" fill="#0f766e" text-anchor="middle">1:N 文档</text>
  <line x1="860" y1="329" x2="893" y2="329" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="877" y="319" font-size="11" fill="#0f766e" text-anchor="middle">热切换</text>

  <g filter="url(#soft)">
    <rect x="70" y="478" width="1065" height="86" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="90" y="506" font-size="13" font-weight="600" fill="#134e4a">基础设施 · 端口实现(port)</text>
  <text x="90" y="532" font-size="12" fill="#57534e">SQLite(元数据 + 任务队列)· data/files 对象存储 · Meili 客户端 · parser 客户端 · LLM 客户端(OpenAI / Anthropic)</text>
  <line x1="190" y1="404" x2="190" y2="476" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="465" y1="404" x2="465" y2="476" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="740" y1="404" x2="740" y2="476" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="1015" y1="404" x2="1015" y2="476" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- parser sidecar 提示条 -->
  <rect x="40" y="622" width="1120" height="98" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="64" y="638" width="296" height="28" rx="9" fill="#b45309"/>
  <text x="212" y="657" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">parser sidecar · Python 3.11 + FastAPI</text>
  <text x="70" y="692" font-size="12.5" fill="#57534e">解析器注册表按类型路由:pypdf · python-docx · python-pptx · markdown-it · bs4 / readability</text>
  <text x="70" y="710" font-size="12.5" fill="#57534e">返回结构化 blocks(标题 / 段落 / 表格 / 列表),供分块器按边界智能切分</text>

  <!-- ===== 流程一:离线存储 ===== -->
  <rect x="40" y="752" width="592" height="192" rx="18" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="64" y="766" width="176" height="28" rx="9" fill="#0d9488"/>
  <text x="152" y="785" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">离线存储 · 入库流水线</text>

  <g filter="url(#soft)">
    <rect x="96" y="806" width="128" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="110" y="831" font-size="12.5" font-weight="600" fill="#1c1917">文件 / 网页</text>
  <text x="110" y="851" font-size="10" fill="#78716c">PDF…HTML · URL 抓取</text>

  <line x1="224" y1="836" x2="246" y2="836" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="235" y="826" font-size="9.5" fill="#78716c" text-anchor="middle">上传/收录</text>

  <g filter="url(#soft)">
    <rect x="248" y="806" width="140" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="262" y="831" font-size="12.5" font-weight="600" fill="#1c1917">文档摄取域</text>
  <text x="262" y="851" font-size="10" fill="#78716c">状态机 + 任务队列</text>

  <line x1="388" y1="836" x2="410" y2="836" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="399" y="826" font-size="9.5" fill="#78716c" text-anchor="middle">任务调度</text>

  <g filter="url(#soft)">
    <rect x="412" y="806" width="120" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="426" y="831" font-size="12.5" font-weight="600" fill="#1c1917">parser 解析</text>
  <text x="426" y="851" font-size="10" fill="#78716c">→ 结构化 blocks</text>

  <!-- 写入存储层 -->
  <path d="M 532 836 H 640 V 968" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="624" y="894" font-size="10.5" fill="#57534e" text-anchor="end">分块 512/80 + 标题上下文</text>
  <text x="624" y="912" font-size="10.5" fill="#57534e" text-anchor="end">SHA-256 去重 · addDocuments</text>

  <!-- ===== 流程二:在线问答 ===== -->
  <rect x="648" y="752" width="512" height="192" rx="18" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="664" y="766" width="150" height="28" rx="9" fill="#44403c"/>
  <text x="739" y="785" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">在线问答 · RAG</text>

  <g filter="url(#soft)">
    <rect x="664" y="806" width="104" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
