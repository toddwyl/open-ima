  <rect x="56" y="966" width="96" height="26" rx="8" fill="#0f766e"/>
  <text x="104" y="983" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">存储层</text>
  <text x="170" y="990" font-size="11.5" fill="#57534e">SQLite 元数据 + 任务队列 · data/files 原始文件</text>
  <text x="170" y="1010" font-size="11.5" fill="#57534e">索引落盘 ./data/meili · WAL 单写者</text>

  <g filter="url(#soft)">
    <rect x="520" y="968" width="460" height="56" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  </g>
  <text x="540" y="992" font-size="13.5" font-weight="600" fill="#134e4a">Meilisearch 1.10.3 · 全文 + 向量混合检索引擎</text>
  <text x="540" y="1012" font-size="11" fill="#57534e">BM25 + 向量 KNN + RRF · jieba 中文分词 · 单 index · kb_biz_id 过滤</text>

  <g filter="url(#soft)">
    <rect x="1032" y="968" width="112" height="56" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="1044" y="992" font-size="12" font-weight="600" fill="#1c1917">Ollama bge-m3</text>
  <text x="1044" y="1010" font-size="10" fill="#78716c">本地 embedding</text>
  <line x1="1032" y1="996" x2="986" y2="996" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="1009" y="987" font-size="9.5" fill="#78716c" text-anchor="middle">向量生成</text>
