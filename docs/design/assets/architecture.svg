<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
    <filter id="soft" x="-4%" y="-8%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1c1917" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- ===== 标题与图例 ===== -->
  <text x="48" y="52" font-size="23" font-weight="700" fill="#1c1917">Open IMA 架构</text>
  <text x="48" y="76" font-size="12.5" fill="#78716c">单机本地部署 · 所有数据保存在本机 ./data 目录</text>

  <line x1="800" y1="44" x2="834" y2="44" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="842" y="49" font-size="12.5" fill="#57534e">离线入库流</text>
  <line x1="946" y1="44" x2="980" y2="44" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="988" y="49" font-size="12.5" fill="#57534e">在线问答流</text>

  <!-- 前端 -->
  <g filter="url(#soft)">
    <rect x="415" y="100" width="370" height="66" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  </g>
  <text x="437" y="126" font-size="14.5" font-weight="600" fill="#134e4a">前端 · 网页界面(内嵌在 Go 服务中)</text>
  <text x="437" y="148" font-size="11.5" fill="#57534e">知识库 / 文档 / 搜索 / 问答 · 设置中心</text>
  <line x1="600" y1="166" x2="600" y2="190" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="615" y="182" font-size="11" fill="#78716c">API · SSE</text>

  <!-- ===== Go 服务(按领域划分) ===== -->
  <rect x="40" y="190" width="1120" height="400" rx="18" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <rect x="64" y="208" width="220" height="30" rx="9" fill="#0d9488"/>
  <text x="174" y="228" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Go 服务 · 按领域划分</text>

  <g filter="url(#soft)">
    <rect x="70" y="254" width="330" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="88" y="286" font-size="14.5" font-weight="600" fill="#134e4a">知识库域</text>
  <text x="88" y="316" font-size="12" fill="#57534e">知识库的创建、删除、查看</text>
  <text x="88" y="338" font-size="12" fill="#57534e">网页链接抓取收录</text>

  <g filter="url(#soft)">
    <rect x="437" y="254" width="330" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="455" y="286" font-size="14.5" font-weight="600" fill="#134e4a">文档摄取域</text>
  <text x="455" y="316" font-size="12" fill="#57534e">文档解析进度管理(状态机)</text>
  <text x="455" y="338" font-size="12" fill="#57534e">自动分块 · 失败自动重试</text>

  <g filter="url(#soft)">
    <rect x="804" y="254" width="330" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="822" y="286" font-size="14.5" font-weight="600" fill="#134e4a">对话问答域</text>
  <text x="822" y="316" font-size="12" fill="#57534e">问题改写 · 语义检索</text>
  <text x="822" y="338" font-size="12" fill="#57534e">流式回答 · 标注引用来源</text>

  <line x1="400" y1="329" x2="433" y2="329" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="418" y="319" font-size="11" fill="#0f766e" text-anchor="middle">一对多</text>

  <g filter="url(#soft)">
    <rect x="70" y="478" width="1065" height="86" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="90" y="506" font-size="13" font-weight="600" fill="#134e4a">基础设施</text>
  <text x="90" y="532" font-size="12" fill="#57534e">SQLite 数据库 · 本地文件存储 · 检索引擎 / 解析器 / 大模型 客户端</text>
  <line x1="235" y1="404" x2="235" y2="476" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="602" y1="404" x2="602" y2="476" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="969" y1="404" x2="969" y2="476" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- 解析服务提示条 -->
  <rect x="40" y="622" width="1120" height="98" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="64" y="638" width="200" height="28" rx="9" fill="#b45309"/>
  <text x="164" y="657" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">解析服务(Python)</text>
  <text x="70" y="692" font-size="12.5" fill="#57534e">按文件类型解析:PDF / Word / PPT / Markdown / 网页</text>
  <text x="70" y="710" font-size="12.5" fill="#57534e">提取出带标题层级的结构化文本,供自动分块</text>

  <!-- ===== 流程一:离线入库 ===== -->
  <rect x="40" y="752" width="592" height="192" rx="18" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="64" y="766" width="170" height="28" rx="9" fill="#0d9488"/>
  <text x="149" y="785" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">离线入库流水线</text>

  <g filter="url(#soft)">
    <rect x="96" y="806" width="128" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="110" y="831" font-size="12.5" font-weight="600" fill="#1c1917">文件 / 网页</text>
  <text x="110" y="851" font-size="10" fill="#78716c">上传或粘贴链接</text>

  <line x1="224" y1="836" x2="246" y2="836" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <g filter="url(#soft)">
    <rect x="248" y="806" width="140" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="262" y="831" font-size="12.5" font-weight="600" fill="#1c1917">排队解析</text>
  <text x="262" y="851" font-size="10" fill="#78716c">后台任务 · 失败重试</text>

  <line x1="388" y1="836" x2="410" y2="836" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <g filter="url(#soft)">
    <rect x="412" y="806" width="120" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="426" y="831" font-size="12.5" font-weight="600" fill="#1c1917">提取文本</text>
  <text x="426" y="851" font-size="10" fill="#78716c">解析服务完成</text>

  <!-- 写入存储层 -->
  <path d="M 532 836 H 640 V 968" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="624" y="894" font-size="10.5" fill="#57534e" text-anchor="end">自动分块 · 重复文件去重</text>
  <text x="624" y="912" font-size="10.5" fill="#57534e" text-anchor="end">写入检索索引</text>

  <!-- ===== 流程二:在线问答 ===== -->
  <rect x="648" y="752" width="512" height="192" rx="18" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="664" y="766" width="130" height="28" rx="9" fill="#44403c"/>
  <text x="729" y="785" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">在线问答(RAG)</text>

  <g filter="url(#soft)">
    <rect x="664" y="806" width="104" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="678" y="831" font-size="12.5" font-weight="600" fill="#1c1917">用户提问</text>
  <text x="678" y="851" font-size="10" fill="#78716c">建立流式连接</text>

  <line x1="768" y1="836" x2="790" y2="836" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <g filter="url(#soft)">
    <rect x="792" y="806" width="116" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="806" y="831" font-size="12.5" font-weight="600" fill="#1c1917">问题改写</text>
  <text x="806" y="851" font-size="10" fill="#78716c">结合对话上下文</text>

  <line x1="908" y1="836" x2="930" y2="836" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <g filter="url(#soft)">
    <rect x="932" y="806" width="104" height="60" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  </g>
  <text x="946" y="831" font-size="12.5" font-weight="600" fill="#134e4a">双路召回</text>
  <text x="946" y="851" font-size="10" fill="#78716c">语义 + 关键词</text>

  <line x1="1036" y1="836" x2="1058" y2="836" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <g filter="url(#soft)">
    <rect x="1060" y="806" width="84" height="60" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="1072" y="831" font-size="12.5" font-weight="600" fill="#1c1917">合并去重</text>
  <text x="1072" y="851" font-size="10" fill="#78716c">取前 8 条</text>

  <line x1="1102" y1="866" x2="1102" y2="888" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <g filter="url(#soft)">
    <rect x="1040" y="888" width="104" height="56" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="1054" y="911" font-size="12.5" font-weight="600" fill="#1c1917">大模型生成</text>
  <text x="1054" y="931" font-size="10" fill="#78716c">标注引用编号</text>

  <line x1="1040" y1="916" x2="784" y2="916" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="912" y="935" font-size="9.5" fill="#78716c" text-anchor="middle">逐字流式返回答案</text>

  <g filter="url(#soft)">
    <rect x="664" y="888" width="116" height="56" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="678" y="911" font-size="12.5" font-weight="600" fill="#1c1917">前端展示</text>
  <text x="678" y="931" font-size="10" fill="#78716c">引用可定位原文</text>

  <!-- 召回存储层(读写双向) -->
  <line x1="948" y1="866" x2="948" y2="968" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
  <text x="936" y="890" font-size="10" fill="#78716c" text-anchor="end">到索引中检索</text>

  <!-- ===== 存储层 ===== -->
  <rect x="40" y="956" width="1120" height="80" rx="18" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <rect x="56" y="966" width="96" height="26" rx="8" fill="#0f766e"/>
  <text x="104" y="983" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">存储层</text>
  <text x="170" y="990" font-size="11.5" fill="#57534e">文档信息与原始文件都存在本机</text>
  <text x="170" y="1010" font-size="11.5" fill="#57534e">检索索引落盘 ./data 目录</text>

  <g filter="url(#soft)">
    <rect x="520" y="968" width="460" height="56" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  </g>
  <text x="540" y="992" font-size="13.5" font-weight="600" fill="#134e4a">Meilisearch · 全文 + 语义混合检索</text>
  <text x="540" y="1012" font-size="11" fill="#57534e">自动中文分词 · 关键词与向量融合排序 · 按知识库隔离</text>

  <g filter="url(#soft)">
    <rect x="1032" y="968" width="112" height="56" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>
  <text x="1044" y="992" font-size="12" font-weight="600" fill="#1c1917">Ollama bge-m3</text>
  <text x="1044" y="1010" font-size="10" fill="#78716c">本地向量模型</text>
  <line x1="1032" y1="996" x2="986" y2="996" stroke="#a8a29e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="1009" y="987" font-size="9.5" fill="#78716c" text-anchor="middle">生成向量</text>
</svg>
