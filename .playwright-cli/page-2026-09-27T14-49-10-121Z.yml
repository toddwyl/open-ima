        - paragraph [ref=e384]: 之亦投研｜宏观分析周报 WEEKLY MACRO RESEARCH · 2026/09/20 美⽇同步加息：全球紧缩重启，⻩⾦通过逆⻛测试 油价、⻓期实际利率与⽇元融资体系，正在共同决定下⼀阶段资产定价 报告⽇期： 2026-09-20 ｜事件截⽌：美国 9 ⽉ 18 ⽇收盘｜北京时间 9 ⽉ 19 ⽇统计 ⼀句话结论：美联储和⽇本央⾏都在加息，但市场没有出现统⼀的 “ 紧缩交易 ” 。美国前端利率继续上修， 10 年期 重回 5% ；⽇本加息后⽇元反⽽⾛弱，说明全球套息平仓尚未启动；⻩⾦在⾼实际利率和两次央⾏加息下收涨， 证明结构性买盘仍在，但⽉度价格趋势尚未完成反转。 美国周期锚 低速去通胀 就业低流动冻结；不是全⾯再通胀 政策脉冲 同步转鹰 Fed 3.75%—4.00% ； BOJ 1.25% 能源传导 2 / 5 步 源头与直接成本确认，⼆轮扩散未确认 ⻩⾦ 4378—4380 9 ⽉ 18 ⽇ XAU/USD 纽约收盘区间 图 1 ：本周主要资产表现。权益内部呈现科技强、传统与⼩盘弱；利率和⻩⾦同时上⾏，是本周最重要的定价分叉。
      - generic [ref=e385]:
        - generic "片段 2" [ref=e386]: "2"
        - paragraph [ref=e387]: 数据：美联储、美国财政部、公开市场收盘数据、 ChartExchange 、 AP 及之亦投研整理。现货与期货合约⼝径不混⽤。 之亦投研｜宏观分析周报 01
      - generic [ref=e388]:
        - generic "片段 3" [ref=e389]: "3"
        - paragraph [ref=e390]: 之亦投研｜宏观分析周报 ⼀、本周最⼤的⽭盾：央⾏同步收紧，市场没有同步紧缩 如果只看政策，美联储和⽇本央⾏在 48 ⼩时内先后加息，最直观的推论应该是：全球融资条件收紧、⽇元升值、 套息交易平仓、⻩⾦和⾼估值科技股承压。实际发⽣的却是 10 年期美债重回 5% ，⽇元跌到 157 上⽅，纳指周线收 涨，⻩⾦也收涨。本周真正需要解释的不是 “ 为什么加息 ” ，⽽是 “ 为什么同样的加息没有形成同⼀条市场主线 ” 。 上⼀期周报认为 9 ⽉加息 25bp 的概率⾼于按兵不动，并将 “ 加⼀次后暂停 ” 设为最可能路径。美联储确实加息，但 9 ⽉ SEP 把 2026 和 2027 年末政策利率中位数都放在 4.1% ，且 18 名官员中 16 ⼈预计年内⾄少还会再加⼀次，说明⾏动⽅向判断正确，政 策持续时间判断偏鸽。 上⼀期判断 结果 结算 如何修正 9 ⽉加息 25bp 更可能 加息 25bp 命中 ⾏动⽅向判断成⽴ ⼀次后暂停为基准 SEP 暗示⾄少再加⼀次 偏鸽 提⾼政策持续时间权重，但不直接改写周 期状态 油价决定通胀尾部 周中冲⾼、周五回落 成⽴ 继续观察国内成本传导，不能只看原油本 身
      - generic [ref=e391]:
        - generic "片段 4" [ref=e392]: "4"
        - paragraph [ref=e393]: ⻩⾦⾯临实际利率压⼒ 先跌后涨，周收涨 压⼒测试 短期逆⻛被结构买盘吸收，但⽉度趋势仍 未反转 图 2 ： 9 ⽉ SEP 与 2026 年宏观预测。当前政策利率不是终点，政策脉冲已经从 “ 观察 ” 切换为 “ 主动收紧 ” 。 先把 “ 政策事实 ” 和 “ 资产反应 ” 分开 这次加息不是因为⻓期通胀补偿已经失锚，⽽是美联储认为当前⾦融条件仍不⾜以把⾼于⽬标的通胀压回 2% 。政策反应函数 把 “ 通胀⽔平仍⾼、⽣产率与资本开⽀强、需求有韧性 ” 放在就业⻛险之前。因此，前端利率需要承担信誉约束，⻓端则继续交 易实际贴现率、财政供给与期限溢价。 通俗解释：美联储不是说经济已经过热到失控，⽽是认为 “ 现在还不够紧 ” 。所以它先加息，同时告诉市场别急着押注很 快降息。 来源：Federal Reserve 9 ⽉ 16 ⽇声明、9 ⽉ SEP。 核⼼⽭盾与 FOMC 结算 02
