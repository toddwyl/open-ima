        - paragraph [ref=e441]: 第⼀步，美联储把政策路径上修。这⾸先反映在 2 年期和中短端实际利率，⽽不是⽴刻制造经济衰退。加息对居⺠、⼩企业和 地产的作⽤快，对拥有现⾦流与 AI 资本开⽀的⼤型科技公司作⽤慢。 第⼆步，油价从周中⾼位回落。它没有消除能源冲击，却阻⽌市场把⼀次供给冲击直接外推成⻓期通胀失锚。因此⻓期通胀补 偿仍停留在约 2.3% ，没有与前端利率同步爆发。 第三步，⽇本央⾏没有给出⾜够强的连续加息承诺。美⽇利差没有快速收窄，⽇元反⽽⾛弱，⽇本居⺠仍在净买海外证券，套 息资⾦⽆需⽴即平仓。全球流动性因⽽没有发⽣断裂式收缩。 第四步，资产回到各⾃的第⼆定价因⼦。科技股重新交易盈利与⽣产率，⻩⾦重新交易央⾏、 ETF 和财政信⽤需求，⼩盘与利 率敏感资产则继续承受融资成本。市场因此分叉，⽽不是统⼀⻛险厌恶。 什么情况会证明这套解释错了 ⽇元快速升值、外汇波动率跳升，⽇本居⺠开始净卖海外债券，纳指同步⾛弱：说明套息平仓真正启动。 5 年和 10 年实际利率继续上⾏，⻩⾦连续收盘跌破 4334 且 ETF 转为净流出：说明结构买盘不⾜以抵抗贴现率。
