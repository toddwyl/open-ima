                - paragraph [ref=e130]: 油运市场测试资料（端到端验证用） 一、市场概况 2026年三季度，原油轮与成品油轮共振处于高景气阶段。VLCC 中东至中国航线（TD3C） 等价期租租金一度达到 76 万美元/天，西非至中国航线约 23.7 万美元/天，均为历史 极值区域。驱动因素包括：红海绕航吸收有效运力、浮仓需求上升、以及全球原油 贸易路线重构带来的吨海里需求增长。 二、招商南油要点 招商南油拥有 MR 成品油轮 20 艘，主要承运成品油与化学品。公司参考股价 4.66 元 （2026年9月13日）。成品油轮运价（TC line）受欧美炼厂开工率与出口配额影响较大， 三季度 TC7 航线运价中枢环比上移约 40%。 三、风险提示 需关注：OPEC+ 增产节奏低于预期、新船交付压力、以及地缘冲突缓和后绕航需求 回落的风险。极端运价不可年化，季度平均 TCE 才是盈利中枢的合理估计。
