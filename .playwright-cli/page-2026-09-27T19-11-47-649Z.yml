              - generic [ref=e163]:
                - heading "知识库中的投资逻辑" [level=2] [ref=e200]
                - paragraph [ref=e201]:
                  - strong [ref=e202]: 核心结论：
                  - text: 招商南油的胜负手已从“行业涨价”转向“MR运价能否兑现到公司报表”[c2]。
                - paragraph [ref=e203]: 具体逻辑包括：
                - list [ref=e204]:
                  - listitem [ref=e205]:
                    - paragraph [ref=e206]:
                      - strong [ref=e207]: 业务映射
                      - text: ：公司73艘运营船队中，20艘自有MR是主要盈利弹性来源，13艘POOL MR提供管理收益，18艘在建（含2艘LR2）[c1]。内贸、COA、原油及化学品业务作为稳定器降低波动。
                  - listitem [ref=e208]:
                    - paragraph [ref=e209]:
                      - strong [ref=e210]: 盈利弹性
                      - text: ：MR每提高1万美元/天，年化利润弹性约4亿元。中性基准$35k/d对应年化归母利润约19.3亿元，若MR维持$50k/d则利润约25.3亿元、EPS约0.54元[c1]。
                  - listitem [ref=e211]:
                    - paragraph [ref=e212]:
                      - strong [ref=e213]: 行业驱动
                      - text: ：当前油运处于原油与成品油共振阶段。中东运输效率下降（STS、等待8-11天）使有效运力减少约17%[c6]；成品油轮受益于柴油裂解差突破100美元/桶、中国出口恢复、LR2 dirty up导致clean船短缺[c3][c4]。
                  - listitem [ref=e214]:
                    - paragraph [ref=e215]:
                      - strong [ref=e216]: 估值与决策
                      - text: ：4.66元股价已对应约1.23倍中性NAV（3.80元），资产端计入一定景气溢价。加仓条件为估值回到NAV附近或MR实现价明显超预期；减仓信号为通航恢复与出口落空同时出现[c8]。
