services:
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${IMA_MEILI_API_KEY:-local-development-key}
    volumes:
      - ../../data/meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 3s
      timeout: 2s
      retries: 20

  parser:
    build:
      context: ../..
      dockerfile: deploy/docker/parser.Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 3s
      timeout: 2s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/app.Dockerfile
    ports:
      - "${IMA_PORT:-8080}:8080"
    environment:
      IMA_HTTP_ADDR: :8080
      IMA_DATA_DIR: /data
      IMA_PUBLIC_BASE_URL: http://app:8080
      IMA_PARSER_URL: http://parser:8100
      IMA_MEILI_URL: http://meilisearch:7700
      IMA_MEILI_API_KEY: ${IMA_MEILI_API_KEY:-local-development-key}
      IMA_MEILI_INDEX: chunks
      IMA_LLM_BASE_URL: ${IMA_LLM_BASE_URL:-https://api.deepseek.com/v1}
      IMA_LLM_PROTOCOL: ${IMA_LLM_PROTOCOL:-openai}
      IMA_LLM_API_KEY: ${IMA_LLM_API_KEY:-}
      IMA_LLM_MODEL: ${IMA_LLM_MODEL:-deepseek-chat}
      IMA_MEILI_EMBEDDER_URL: ${IMA_MEILI_EMBEDDER_URL:-http://host.docker.internal:11434/api/embeddings}
      IMA_MEILI_EMBEDDER_MODEL: ${IMA_MEILI_EMBEDDER_MODEL:-bge-m3}
      IMA_MEILI_EMBEDDER_DIMENSIONS: ${IMA_MEILI_EMBEDDER_DIMENSIONS:-1024}
    volumes:
      - ../../data/app:/data
    depends_on:
      meilisearch:
        condition: service_healthy
      parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 20

  model-mock:
    profiles: ["smoke"]
    build:
      context: ../..
      dockerfile: deploy/docker/app.Dockerfile
    entrypoint: ["/app/mock-model"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8200/health"]
      interval: 2s
      timeout: 2s
      retries: 20
